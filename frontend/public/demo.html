<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BuildScope — Marketplace Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b1220;
      --panel: rgba(17, 28, 48, 0.88);
      --line: rgba(56, 189, 248, 0.22);
      --cyan: #38bdf8;
      --teal: #2dd4bf;
      --amber: #fbbf24;
      --text: #e8eef9;
      --muted: #93a4c3;
      --ok: #34d399;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      font-family: "DM Sans", system-ui, sans-serif; background: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 50% at 10% -10%, rgba(56,189,248,.18), transparent 55%),
        radial-gradient(ellipse 60% 40% at 90% 0%, rgba(45,212,191,.12), transparent 50%),
        linear-gradient(rgba(56,189,248,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56,189,248,.04) 1px, transparent 1px);
      background-size: auto, auto, 48px 48px, 48px 48px;
    }
    h1,h2,h3,.display { font-family: Syne, system-ui, sans-serif; letter-spacing: -.02em; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 20px 80px; }
    .btn {
      border: 0; border-radius: 12px; padding: 14px 22px; font-weight: 700;
      cursor: pointer; font-size: 15px; font-family: inherit;
    }
    .btn-cyan { background: var(--cyan); color: #041018; }
    .btn-cyan:hover { filter: brightness(1.08); }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
    .panel {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 16px; padding: 20px; backdrop-filter: blur(8px);
    }
    .tag {
      display: inline-block; border: 1px solid var(--line); border-radius: 999px;
      padding: 4px 10px; font-size: 12px; color: var(--teal); margin: 2px;
    }
    .chip {
      display: inline-block; background: rgba(251,191,36,.12); color: var(--amber);
      border-radius: 6px; padding: 3px 8px; font-size: 11px; margin: 2px;
    }
    .hidden { display: none !important; }
    .rise { animation: rise .4s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 0% { transform: scale(.92); opacity:.7 } 70% { transform: scale(1.15); opacity:0 } 100% { opacity:0 } }
    .ring { position: absolute; inset: 0; border: 1px solid var(--cyan); border-radius: 999px; animation: pulse 1.5s ease-out infinite; }
    .bar { height: 8px; background: rgba(56,189,248,.12); border-radius: 999px; overflow: hidden; }
    .bar > i { display:block; height:100%; width:0; background: linear-gradient(90deg,var(--cyan),var(--teal)); transition: width .5s; }
    .grid2 { display: grid; gap: 20px; }
    @media (min-width: 900px) { .grid2 { grid-template-columns: 1fr 1fr; } }
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #062816; border: 1px solid var(--ok); color: var(--ok);
      padding: 12px 20px; border-radius: 999px; font-weight: 600; z-index: 50;
    }
    a { color: var(--cyan); }
  </style>
</head>
<body>
  <div id="app" class="wrap"></div>
  <div id="toast" class="toast hidden"></div>

<script>
const DATA = {
  projectName: "Culver Flats TI",
  address: "1247 E Culver St, Phoenix, AZ 85006",
  tags: ["R-2 Multifamily", "Type V-A Wood Frame", "Alteration L2", "$1.85M"],
  score: 92,
  feeLow: 18420, feeHigh: 27650,
  scopes: ["Structural_ShearWall","Electrical_PanelUpgrade","Fire_Alarm","Roofing_TPO","Drywall_TypeX","Windows_Egress","Framing_Interior","Paint_Interior"],
  permits: [
    { src: "https://www.phoenix.gov/pdd/permit-services", verified: "Verified Aug 2026", name: "Commercial Building Permit", auth: "Phoenix Planning & Development", why: "Alteration > $50k + structural scope", cite: "IBC 2021 §105.1", fee: "$8.2k–$11.4k", time: "3–5 weeks", conf: 98, docs: ["Permit application","Stamped drawings","Soils letter"] },
    { src: "https://www.phoenix.gov/pdd/permit-services", verified: "Verified Aug 2026", name: "Electrical Permit", auth: "City of Phoenix — Electrical", why: "New 400A service / panel upgrade", cite: "NEC 2020 Art. 230", fee: "$1.4k–$2.1k", time: "1–2 weeks", conf: 96, docs: ["Load calc","One-line diagram"] },
    { src: "https://www.phoenix.gov/pdd/permit-services", verified: "Verified Aug 2026", name: "Plumbing Permit", auth: "City of Phoenix — Plumbing", why: "Fixture relocation + DWV rough-in", cite: "UPC 2021 Ch. 4", fee: "$980–$1.4k", time: "1–2 weeks", conf: 93, docs: ["Isometric riser","Fixture schedule"] },
    { src: "https://www.phoenix.gov/fire/prevention", verified: "Verified Aug 2026", name: "Fire Alarm Permit", auth: "Phoenix Fire Prevention", why: "New addressable fire alarm devices", cite: "NFPA 72 / IBC §907.2", fee: "$2.4k–$3.6k", time: "2–3 weeks", conf: 97, docs: ["FA shop drawings","Battery calc"] },
    { src: "https://codes.iccsafe.org/content/IBC2021P1/chapter-17-special-inspections-and-tests", verified: "Verified Aug 2026", name: "Special Inspection — Structural", auth: "Phoenix Building Official", why: "Shear wall + moment frame work", cite: "IBC 2021 §1705.3", fee: "$1.8k–$2.8k", time: "Concurrent", conf: 95, docs: ["Special inspection agreement"] },
    { src: "https://roc.az.gov/contractor-search", verified: "Verified Aug 2026", name: "Contractor License Verification", auth: "Arizona ROC", why: "Licensed GC required", cite: "A.R.S. §32-1101", fee: "—", time: "Same day", conf: 99, docs: ["ROC license #","COI / workers comp"] },
    { src: "https://www.phoenix.gov/pdd/historic-preservation", verified: "Verified Aug 2026", name: "Historic Overlay Review", auth: "Historic Preservation Office", why: "Coronado Historic District", cite: "Phoenix HP Overlay", fee: "$2.1k–$4.1k", time: "4–6 weeks", conf: 90, docs: ["HP application","Elevation photos"] },
    { src: "https://www.phoenix.gov/streets/permits", verified: "Verified Aug 2026", name: "Right-of-Way / Dumpster Permit", auth: "Street Transportation", why: "Sidewalk staging", cite: "City Code Ch. 31", fee: "$350–$600", time: "3–5 days", conf: 88, docs: ["ROW application","Traffic plan"] },
  ],
  subs: [
    { trade: "Framing", company: "Desert Ridge Framing Co.", rating: 4.9, reviews: 214, match: 97, addr: "3820 N 27th Ave, Phoenix", phone: "(602) 555-0142", price: "$42–58 / sf", eta: "Available in 9 days", maps: "https://www.google.com/maps/search/?api=1&query=framing+contractor+Phoenix+AZ", review: { a: "Mike R.", t: "On time, clean site, passed framing inspection first try.", ago: "2 months ago", stars: 5 } },
    { trade: "Roofing", company: "Sonoran Roof Systems", rating: 4.8, reviews: 168, match: 95, addr: "2101 W Encanto Blvd, Phoenix", phone: "(602) 555-0198", price: "$8.5–12 / sf", eta: "Available in 12 days", maps: "https://www.google.com/maps/search/?api=1&query=roofing+contractor+Phoenix+AZ", review: { a: "Chris P.", t: "TPO tear-off done in two days. No leaks after monsoon.", ago: "3 weeks ago", stars: 5 } },
    { trade: "Electrical", company: "Copper State Electric", rating: 4.9, reviews: 412, match: 96, addr: "901 S 7th Ave, Phoenix", phone: "(602) 555-0177", price: "$85–120 / hr", eta: "Available in 5 days", maps: "https://www.google.com/maps/search/?api=1&query=electrical+contractor+Phoenix+AZ", review: { a: "Priya N.", t: "Panel upgrade and fire alarm rough — inspector signed same day.", ago: "6 weeks ago", stars: 5 } },
    { trade: "Plumbing", company: "AquaLine Plumbing LLC", rating: 4.6, reviews: 189, match: 93, addr: "4420 E Washington St, Phoenix", phone: "(623) 555-0133", price: "$95–135 / hr", eta: "Available in 7 days", maps: "https://www.google.com/maps/search/?api=1&query=plumbing+contractor+Phoenix+AZ", review: { a: "Luis G.", t: "Rough-in was clean. No punch list on final.", ago: "2 months ago", stars: 5 } },
    { trade: "Drywall", company: "Valley Drywall Pros", rating: 4.7, reviews: 301, match: 94, addr: "1544 E McDowell Rd, Phoenix", phone: "(480) 555-0111", price: "$3.2–4.8 / sf", eta: "Available next week", maps: "https://www.google.com/maps/search/?api=1&query=drywall+contractor+Phoenix+AZ", review: { a: "Sam T.", t: "Type X hang and finish looked factory-smooth.", ago: "1 month ago", stars: 5 } },
    { trade: "Painting", company: "Spectrum Coatings", rating: 4.7, reviews: 340, match: 92, addr: "2202 W Camelback Rd, Phoenix", phone: "(602) 555-0129", price: "$1.8–2.9 / sf", eta: "Available in 10 days", maps: "https://www.google.com/maps/search/?api=1&query=painting+contractor+Phoenix+AZ", review: { a: "Rachel B.", t: "Commercial paint crew that actually masks correctly.", ago: "1 month ago", stars: 5 } },
  ]
};

const STAGES = [
  "Scanning plan sheets",
  "Extracting scope & trades",
  "Matching permits & docs",
  "Pulling Google Maps contractors"
];

let step = "landing";
let fileName = "Culver-Flats-Permit-Set.pdf";
let invited = {};
let uploaded = [];

function go(s) { step = s; render(); }

function useDemoSet() {
  uploaded = [{ name: "Culver-Flats-Permit-Set.pdf", size: 8_420_000 }];
  fileName = uploaded[0].name;
  startAnalyze();
}

function acceptFiles(list) {
  if (!list || !list.length) return;
  uploaded = Array.from(list).map((f) => ({ name: f.name, size: f.size }));
  fileName = uploaded[0].name;
  paintFiles();
}

function paintFiles() {
  const box = document.getElementById("filelist");
  const label = document.getElementById("fname");
  const run = document.getElementById("run");
  if (!box) return;
  if (label) label.textContent = uploaded.length + " file(s) ready";
  box.innerHTML = uploaded.map((f) => `
    <div class="panel" style="display:flex;justify-content:space-between;align-items:center;margin:8px 0;padding:12px 16px">
      <div><strong style="font-size:14px">${f.name}</strong>
      <div style="font-size:12px;color:var(--muted)">${(f.size/1048576).toFixed(1)} MB · queued</div></div>
      <span style="color:var(--ok);font-size:13px;font-weight:700">✓</span>
    </div>`).join("");
  if (run) { run.style.opacity = "1"; run.style.pointerEvents = "auto"; }
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.remove("hidden");
  setTimeout(() => el.classList.add("hidden"), 2200);
}

function render() {
  const app = document.getElementById("app");
  if (step === "landing") {
    app.innerHTML = `
      <div class="rise" style="min-height:80vh;display:flex;flex-direction:column;justify-content:center">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:48px">
          <div class="display" style="font-size:28px;font-weight:800;color:var(--cyan)">BuildScope</div>
          <span class="tag">Marketplace Demo</span>
        </div>
        <p style="color:var(--teal);text-transform:uppercase;letter-spacing:.2em;font-size:13px;font-weight:600">Permits + local trades</p>
        <h1 class="display" style="font-size:clamp(40px,7vw,72px);line-height:1.05;margin:12px 0 20px">Upload plans.<br/>Get permits.<br/>Hire the crew.</h1>
        <p style="color:var(--muted);font-size:18px;max-width:480px">AI finds required permits, licenses & documents — then matches real subcontractors nearby from Google Maps with reviews.</p>
        <div style="margin-top:32px">
          <button class="btn btn-cyan" onclick="go('upload')">Analyze Project →</button>
          <div style="margin-top:14px;font-size:12px;color:var(--muted)">Reasoning by <strong style="color:var(--teal)">Gemini</strong> · rules verified against jurisdiction codes</div>
        </div>
      </div>`;
    return;
  }

  if (step === "upload") {
    app.innerHTML = `
      <button class="btn btn-ghost" onclick="go('landing')">← Back</button>
      <h1 class="display rise" style="font-size:42px;margin:24px 0 8px">Upload project plans</h1>
      <p style="color:var(--muted)">Drop a plan set, browse your files, or run the demo project.</p>

      <div id="drop" class="panel rise" style="margin-top:24px;min-height:220px;border:2px dashed var(--line);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.2s">
        <div style="font-size:40px;color:var(--cyan)">⬆</div>
        <div id="fname" style="margin-top:10px;font-size:18px;font-weight:700">Drop plan set here</div>
        <div style="margin-top:6px;color:var(--muted);font-size:13px">PDF · DWG · RVT · JPG · PNG · ZIP</div>
        <button id="browse" class="btn btn-ghost" style="margin-top:16px;padding:10px 18px;font-size:13px">Browse files</button>
        <input id="picker" type="file" multiple style="display:none"
          accept=".pdf,.dwg,.dxf,.rvt,.ifc,.jpg,.jpeg,.png,.tif,.tiff,.zip" />
      </div>

      <div id="filelist" style="margin-top:14px"></div>

      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:20px">
        <button id="run" class="btn btn-cyan" style="opacity:.4;pointer-events:none">Run AI Analysis →</button>
        <button class="btn btn-ghost" onclick="useDemoSet()">★ Use demo plan set</button>
      </div>`;

    const drop = document.getElementById("drop");
    const picker = document.getElementById("picker");

    document.getElementById("browse").onclick = (e) => { e.stopPropagation(); picker.click(); };
    drop.onclick = () => picker.click();
    picker.onchange = () => acceptFiles(picker.files);

    drop.ondragover = (e) => { e.preventDefault(); drop.style.borderColor = "var(--teal)"; drop.style.background = "rgba(45,212,191,.1)"; };
    drop.ondragleave = () => { drop.style.borderColor = "var(--line)"; drop.style.background = ""; };
    drop.ondrop = (e) => {
      e.preventDefault();
      drop.style.borderColor = "var(--teal)";
      drop.style.background = "rgba(45,212,191,.08)";
      acceptFiles(e.dataTransfer.files);
    };

    document.getElementById("run").onclick = () => startAnalyze();
    if (uploaded.length) paintFiles();
    return;
  }

  if (step === "analyzing") {
    app.innerHTML = `
      <div class="rise" style="max-width:520px;margin:80px auto;text-align:center">
        <div style="position:relative;width:100px;height:100px;margin:0 auto 28px">
          <div class="ring"></div>
          <div class="ring" style="inset:12px;border-color:var(--teal);animation-delay:.4s"></div>
        </div>
        <h1 class="display" style="font-size:32px">Analyzing ${fileName}</h1>
        <p style="color:var(--muted)">Phoenix rules · Google Maps match</p>
        <div class="bar" style="margin:28px 0"><i id="prog"></i></div>
        <div id="stages" style="text-align:left"></div>
      </div>`;
    runStages();
    return;
  }

  // results
  app.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px">
      <div><div class="display" style="color:var(--cyan);font-size:22px;font-weight:800">BuildScope</div>
      <div style="color:var(--muted);font-size:13px">Permits ready · contractors matched</div></div>
      <button class="btn btn-ghost" onclick="invited={};uploaded=[];go('landing')">New project</button>
    </div>
    <div class="rise" style="display:grid;gap:16px;grid-template-columns:1.4fr 1fr">
      <div class="panel">
        <h1 class="display" style="font-size:34px;margin:0">${DATA.projectName}</h1>
        <p style="color:var(--muted)">${DATA.address}</p>
        <div style="margin-top:12px">${DATA.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
      </div>
      <div class="panel" style="border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.08)">
        <div style="color:var(--amber);font-size:12px;letter-spacing:.15em;text-transform:uppercase">Project readiness</div>
        <div class="display" style="font-size:64px;color:var(--amber);font-weight:800">${DATA.score}</div>
        <div style="color:var(--muted);font-size:14px">Est. fees $${DATA.feeLow.toLocaleString()} – $${DATA.feeHigh.toLocaleString()}</div>
        <div style="color:var(--muted);font-size:14px">${DATA.permits.length} permits/docs · ${DATA.subs.length} local trades</div>
      </div>
    </div>
    <div style="margin:18px 0">${DATA.scopes.map(s=>`<span class="tag" style="color:var(--cyan)">${s}</span>`).join("")}</div>
    <div class="grid2" style="margin-top:28px">
      <div>
        <h2 class="display" style="font-size:26px">Permits, licenses & documents</h2>
        <div class="panel" style="padding:12px 16px;font-size:12px;color:var(--muted);border-color:rgba(52,211,153,.3)">
          Every item is traced to a published code section or agency page — no AI-invented permits.
          Scope is read by Gemini; the permit decision comes from the jurisdiction rule set.
        </div>
        ${DATA.permits.map(p=>`
          <div class="panel" style="margin:12px 0">
            <div style="display:flex;justify-content:space-between;gap:8px">
              <div><strong>${p.name}</strong><div style="font-size:12px;color:var(--muted)">${p.auth}</div></div>
              <span style="background:rgba(52,211,153,.15);color:var(--ok);border-radius:999px;padding:2px 8px;font-size:12px;font-weight:700">${p.conf}%</span>
            </div>
            <div style="font-size:13px;color:var(--muted);margin:8px 0">Why: ${p.why}</div>
            <div>${p.docs.map(d=>`<span class="chip">${d}</span>`).join("")}</div>
            <div style="font-size:12px;color:var(--teal);margin-top:8px">${p.cite} · ${p.fee} · ${p.time}</div>
            <div style="display:flex;align-items:center;gap:10px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)">
              <a href="${p.src}" target="_blank" style="font-size:12px;font-weight:600">🔗 View official source</a>
              <span style="font-size:11px;color:var(--ok)">✓ ${p.verified}</span>
            </div>
          </div>`).join("")}
      </div>
      <div>
        <div style="display:flex;justify-content:space-between;align-items:end">
          <h2 class="display" style="font-size:26px;margin:0">Subcontractors near you</h2>
          <span style="font-size:12px;color:var(--muted)">via Google Maps</span>
        </div>
        ${DATA.subs.map((s,i)=>`
          <div class="panel" style="margin:12px 0">
            <div style="display:flex;justify-content:space-between">
              <div>
                <div style="font-size:11px;color:var(--cyan);text-transform:uppercase;letter-spacing:.08em">${s.trade}</div>
                <strong>${s.company}</strong>
                <div style="font-size:12px;color:var(--muted)">★ ${s.rating} (${s.reviews}) · ${s.price}</div>
                <div style="font-size:12px;color:var(--muted)">${s.addr}</div>
                <div style="font-size:12px;color:var(--muted)">${s.phone} · ${s.eta}</div>
              </div>
              <div style="text-align:right"><div class="display" style="font-size:28px;color:var(--teal);font-weight:800">${s.match}%</div><div style="font-size:10px;color:var(--muted)">MATCH</div></div>
            </div>
            <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12px">
              <div style="color:var(--amber)">${"★".repeat(s.review.stars)} <span style="color:var(--muted)">${s.review.a} · ${s.review.ago}</span></div>
              <div style="margin-top:4px">“${s.review.t}”</div>
              <div style="font-size:10px;color:var(--muted);margin-top:6px;text-transform:uppercase">Source: Google Maps</div>
            </div>
            <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
              <a class="btn btn-ghost" style="padding:8px 12px;font-size:12px;text-decoration:none" href="${s.maps}" target="_blank">Open in Maps</a>
              <button class="btn btn-cyan" style="padding:8px 12px;font-size:12px;margin-left:auto" ${invited[i]?"disabled style='padding:8px 12px;font-size:12px;background:rgba(52,211,153,.25);color:var(--ok)'":""}
                onclick="invited[${i}]=true;toast('Invite sent to ${s.company.replace(/'/g,"")}');render()">
                ${invited[i] ? "Invite sent ✓" : "Invite / Request quote"}
              </button>
            </div>
          </div>`).join("")}
      </div>
    </div>`;
}

function startAnalyze() {
  step = "analyzing";
  render();
}

function runStages() {
  const box = document.getElementById("stages");
  const prog = document.getElementById("prog");
  let i = 0;
  const tick = () => {
    if (!box) return;
    box.innerHTML = STAGES.map((s, idx) => {
      const done = idx < i, active = idx === i;
      return `<div class="panel" style="margin:8px 0;opacity:${idx>i?.45:1};border-color:${done?"rgba(52,211,153,.35)":active?"var(--cyan)":"var(--line)"}">
        <strong style="color:${done?"var(--ok)":active?"var(--cyan)":"inherit"}">${done?"✓":idx+1}</strong> ${s}
      </div>`;
    }).join("");
    if (prog) prog.style.width = Math.min(100, (i / STAGES.length) * 100) + "%";
    if (i >= STAGES.length) {
      setTimeout(() => { step = "results"; render(); }, 400);
      return;
    }
    i++;
    setTimeout(tick, 750);
  };
  tick();
}

render();
</script>
</body>
</html>
